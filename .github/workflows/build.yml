name: Build Android APK
on:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.3"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organize flat upload into folders
        run: |
          mkdir -p scripts scenes config tests docs
          mv -n cfg.gd sfx.gd net.gd fighter.gd world.gd fx.gd game.gd hud.gd touch.gd menu.gd scripts/ || true
          mv -n main.tscn game.tscn scenes/ || true
          mv -n weapons.json config/ || true
          mv -n smoke_solo.gd smoke_solo.tscn net_test.gd net_test.tscn tests/ || true
          mv -n android_build.md networking_troubleshooting.md docs/ || true
          rm -f icon.svg.import
          ls -R | head -60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: yes | sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Install Godot and export templates
        run: |
          B=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $PWD/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" "$PWD" > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/JetpackArena.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JetpackArena-apk
          path: build/JetpackArena.apk
